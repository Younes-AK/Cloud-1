services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wordpress:/var/www/wp:ro
    depends_on:
      - wordpress
      - phpmyadmin
    restart: unless-stopped
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    env_file: .env
    volumes:
      - wordpress:/var/www/wp
    depends_on:
      - mariadb
    restart: unless-stopped
    networks:
      - inception

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    env_file: .env
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped
    networks:
      - inception
  
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DOMAIN_NAME}/phpmyadmin/
      UPLOAD_LIMIT: 64M
    depends_on:
      - mariadb
    networks:
      - inception
    restart: always

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/inception/data/wordpress
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/inception/data/database

networks:
  inception:
