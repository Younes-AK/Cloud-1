services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wordpress:/var/www/wp:ro
    depends_on:
      - wordpress
    restart: unless-stopped
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    env_file: .env
    volumes:
      - wordpress:/var/www/wp
    depends_on:
      - mariadb
    restart: unless-stopped
    networks:
      - inception

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    env_file: .env
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped
    networks:
      - inception

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/inception/data/wordpress
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/inception/data/database

networks:
  inception:
